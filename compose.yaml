services:
  db:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: bot
    volumes:
      - ./.pgdata:/var/lib/postgresql/data

  api:
    build: .
    command: uv run --no-sync uvicorn api.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+asyncpg://bot:${DB_PASSWORD}@db:5432/bot
    depends_on: [db]
    ports:
      - "8000:8000"

  bot:
    build: .
    restart: always
    command: uv run --no-sync python -m bot.main
    environment:
      TOKEN: ${TOKEN}
      DATABASE_URL: postgresql+asyncpg://bot:${DB_PASSWORD}@db:5432/bot
    depends_on: [db]